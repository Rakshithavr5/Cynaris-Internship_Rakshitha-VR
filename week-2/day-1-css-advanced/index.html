<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Advanced | Week 2 Day 1</title>
    <link rel="stylesheet" href="advanced_styles.css" />
  </head>
  <body>
    <!-- Sticky Navigation -->
    <nav>
      <h2>✨ CSS Advanced</h2>
      <div>
        <a href="#home">Home</a>
        <a href="#features">Features</a>
        <a href="#progress">Progress</a>
        <button class="button" id="themeToggle">🌙 Dark Mode</button>
      </div>
    </nav>

    <!-- Home Section -->
    <section id="home" class="container">
      <div class="card">
        <h1>Advanced CSS Techniques</h1>
        <p>
          Explore CSS custom properties, animations, pseudo-elements, sticky
          navigation, and smooth scrolling.
        </p>
        <button
          class="button"
          onclick="
            document
              .querySelector('#features')
              .scrollIntoView({ behavior: 'smooth' })
          "
        >
          Explore Features
        </button>
      </div>
    </section>

    <!-- Features Section -->
    <section id="features" class="container">
      <div class="card">
        <h2>CSS Loading Animation</h2>
        <p>This spinner is created entirely with CSS.</p>
        <div class="spinner"></div>
      </div>
    </section>

    <!-- Progress Section -->
    <section id="progress" class="container">
      <div class="card">
        <h2>Learning Progress</h2>
        <p>CSS Advanced — 75% complete</p>
        <div class="progress">
          <div class="progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- Theme Switcher -->
    <script>
      const themeToggle = document.getElementById("themeToggle");
      const page = document.documentElement;

      themeToggle.addEventListener("click", () => {
        const isDark = page.getAttribute("data-theme") === "dark";

        page.setAttribute("data-theme", isDark ? "light" : "dark");
        themeToggle.textContent = isDark ? "🌙 Dark Mode" : "☀️ Light Mode";
      });
    </script>
  </body>
</html>
